name: vulncheck

# Runs govulncheck against the exact source and dependencies the image is
# built from (the Dockerfile's vulncheck stage). The weekly run catches newly
# published vulnerabilities. A failed scheduled run sends a GitHub
# notification. This workflow never blocks publishing a base-image update.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: govulncheck
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: vulncheck
          push: false
          no-cache-filters: vulncheck # always fetch the latest vulnerability database
